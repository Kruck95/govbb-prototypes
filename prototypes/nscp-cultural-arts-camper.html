        <div data-show-when-name="${name}" data-show-when-value="Yes" style="display:${GovBB.D[name] === 'Yes' ? '' : 'none'}">

/* ───────── Validation ───────── */
function validate(pageId) {
  const D = GovBB.D;
  const errors = [];
  const req = (id, msg) => { if (!D[id] || !String(D[id]).trim()) errors.push({ id, msg }); };

  if (pageId === 'camp-venue') req('camp-venue', 'Name or venue of camp – Tell us the name or place of the camp');

  if (pageId === 'camper-name') {
    req('camper-first-name', 'First name – Enter your child\'s first name');
    req('camper-last-name', 'Last name – Enter your child\'s last name');
  }

  if (pageId === 'camper-address') {
    req('camper-address', 'Address – Enter where your child lives');
    req('camper-parish', 'Parish – Choose a parish');
  }

  if (pageId === 'camper-dob') {
    const d = D['camper-dob-day'], m = D['camper-dob-month'], y = D['camper-dob-year'];
    if (!d || !m || !y) {
      errors.push({ id: 'camper-dob-day', msg: 'Date of birth – Enter your child\'s date of birth' });
    } else {
      const dt = new Date(+y, +m - 1, +d);
      if (dt > new Date()) errors.push({ id: 'camper-dob-day', msg: 'Date of birth – The date cannot be in the future' });
    }
    req('camper-age', 'Age – Enter your child\'s age in years');
  }

  if (pageId === 'camper-id') {
    if (!D['camper-id'] || !D['camper-id'].trim()) errors.push({ id: 'camper-id', msg: 'National ID number – Enter your child\'s National ID number' });
    else if (!/^[0-9]{6}-[0-9]{4}$/.test(D['camper-id'].trim())) errors.push({ id: 'camper-id', msg: 'National ID number – Enter the number in the format 110915-0048' });
  }

  if (pageId === 'camper-gender') req('camper-gender', 'Gender – Choose an option');
  if (pageId === 'camper-religion') req('camper-religion', 'Religion – Choose an option');

  if (pageId === 'guardian-name') {
    req('guardian-name', 'Name – Enter the parent or guardian\'s name');
    req('guardian-relationship', 'Relationship – Tell us your relationship to the child');
  }

  if (pageId === 'guardian-address') {
    req('guardian-address', 'Address – Enter where the parent or guardian lives');
    req('guardian-parish', 'Parish – Choose a parish');
  }

  if (pageId === 'guardian-contact') {
    req('guardian-phones', 'Telephone numbers – Enter at least one phone number');
    if (!D['contact-email'] || !D['contact-email'].trim()) errors.push({ id: 'contact-email', msg: 'Email address – Enter an email address' });
    else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(D['contact-email'])) errors.push({ id: 'contact-email', msg: 'Email address – Enter a valid email address' });
  }

  if (pageId === 'guardian-employer') req('guardian-employer', 'Employer – Enter the name of your employer or business');

  if (pageId === 'curriculum') req('curriculum', 'Camp – Choose Cultural Arts or Digital Media');
  if (pageId === 'curriculum-location') req('curriculum-location', 'Camp location – Choose a location');

  if (pageId === 'health-illness') {
    req('has-illness', 'Illness – Choose Yes or No');
    if (D['has-illness'] === 'Yes') req('illness-detail', 'Illness details – Tell us about the illness');
  }
  if (pageId === 'health-medication') {
    req('on-medication', 'Medication – Choose Yes or No');
    if (D['on-medication'] === 'Yes') req('medication-detail', 'Medication details – Tell us the medicine and dosage');
  }
  if (pageId === 'health-disability') {
    req('has-disability', 'Disability – Choose Yes or No');
    if (D['has-disability'] === 'Yes') req('disability-detail', 'Disability details – Tell us about the disability');
  }
  if (pageId === 'health-allergies') {
    req('has-allergies', 'Allergies – Choose Yes or No');
    if (D['has-allergies'] === 'Yes') req('allergy-detail', 'Allergy details – Tell us about the allergies');
  }

  if (pageId === 'meals') req('takes-meals', 'Meals – Choose Yes or No');
  if (pageId === 'dietary') {
    req('dietary', 'Diet needs – Choose an option');
    if (D['dietary'] === 'Other') req('dietary-other', 'Diet needs – Tell us about the diet need');
  }

  if (pageId === 'activity-exemptions') req('activity-exemptions', 'Activities – List any activities to leave out, or write "None"');

  if (pageId === 'emergency-contact') {
    req('emergency-name', 'Contact name – Enter an emergency contact name');
    req('emergency-relationship', 'Relationship – Tell us how this person knows your child');
    req('emergency-number', 'Phone number – Enter an emergency phone number');
  }

  if (pageId === 'doctor') {
    req('doctor-name', 'Doctor or polyclinic – Enter the name');
    req('doctor-phone', 'Phone number – Enter an emergency phone number');
  }

  if (pageId === 'photo-permission') req('photo-permission', 'Photos and videos – Choose Yes or No');

  if (pageId === 'conduct') {
    const allTicked = CONDUCT_ITEMS.every(([id]) => D[id]);
    if (!allTicked) errors.push({ id: CONDUCT_ITEMS[0][0], msg: 'Conduct agreement – Tick every box to show you agree to the camp rules' });
  }

  if (pageId === 'declaration') {
    if (!D['decl-agree']) errors.push({ id: 'decl-agree', msg: 'Agreement – You must agree before you can send the form' });
  }

  return errors;
}

/* ───────── Flow (with conditional branching) ───────── */
function buildFlow() {
  const flow = [
    'start', 'camp-venue',
    'camper-name', 'camper-address', 'camper-dob', 'camper-id', 'camper-gender', 'camper-religion',
    'guardian-name', 'guardian-address', 'guardian-contact', 'guardian-employer',
    'curriculum'
  ];
  // Digital Media skips the Cultural Arts location question
  if (GovBB.D['curriculum'] === 'Cultural Arts') flow.push('curriculum-location');
  flow.push(
    'health-intro', 'health-illness', 'health-medication', 'health-disability', 'health-allergies',
    'meals', 'dietary',
    'activity-exemptions', 'emergency-contact', 'doctor',
    'photo-permission', 'conduct', 'declaration',
    'check', 'confirmation'
  );
  return flow;
}

/* ───────── Init ───────── */
GovBB.init({
  formName: FORM_NAME,
  flow: buildFlow(),
  pages: PAGES,
  validate: validate,
  getFlow: buildFlow
});
</script>
